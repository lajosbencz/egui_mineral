id: stable-id-display-text
valid:
  - |
    fn f(&self) {
        let a = StableId::new(&self.key);
        let b = StableId::new(format!("{}-{i}-item", self.key));
        let c = StableId::new(format!("{key}-radio-group"));
    }
invalid:
  - |
    fn f(&self) {
        let a = StableId::new(format!("{}-{}", self.key, self.label));
    }
  - |
    fn f(key: &str, name: &str) {
        let a = StableId::new(format!("{key}-{name}"));
    }
  - |
    fn f(label: &str) {
        let a = StableId::new(label);
    }
