id: raw-egui-area
language: rust
severity: error
message: Areas and modals go through kit::overlay::area, kit::overlay::modal_area and kit::overlay::modal (reduced-motion fade gate, reading-direction layout).
files:
  - crates/**/src/**
  - examples/**
ignores:
  - crates/egui_mineral/src/kit/layer.rs
rule:
  kind: call_expression
  has:
    field: function
    kind: scoped_identifier
    regex: (^|::)(Area::new|Modal::new|Modal::default_area)$
