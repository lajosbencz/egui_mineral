# https://release-plz.dev/docs/config
# Versions are per crate; the align job of release-plz.yml raises the others when one crate's 0.MINOR rises.
[workspace]
git_release_enable = true
git_tag_enable = true
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} v{{ version }}"
release_always = false
# CI already built the merged commit; `Public API diff` gates breaking changes on the release PR.
semver_check = false
publish_no_verify = true
pr_labels = ["release"]

[changelog]
protect_breaking_commits = true
