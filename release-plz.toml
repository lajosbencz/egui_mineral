# https://release-plz.dev/docs/config
[workspace]
release = false
changelog_path = "./CHANGELOG.md"
git_release_enable = false
git_tag_enable = false
release_always = false
semver_check = true
pr_labels = ["release"]

[[package]]
name = "egui_mineral"
changelog_include = ["egui_mineral_macros", "egui_mineral_material"]
git_release_enable = true
git_release_name = "v{{ version }}"
git_tag_enable = true
git_tag_name = "v{{ version }}"
version_group = "mineral"

[[package]]
name = "egui_mineral_macros"
changelog_update = false
version_group = "mineral"

[[package]]
name = "egui_mineral_material"
changelog_update = false
version_group = "mineral"

[changelog]
protect_breaking_commits = true
