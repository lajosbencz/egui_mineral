[package]
name = "egui_mineral_fluent"
description = "Fluent 2 (Fluent UI React v9) stylekit for egui_mineral"
version = "0.12.1"
edition.workspace = true
rust-version.workspace = true
# Ships MIT data and fonts derived from Fluent UI (LICENSE-MIT, NOTICE).
license = "GPL-3.0-or-later AND MIT"
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords.workspace = true
categories.workspace = true
exclude = ["clippy.toml"]

[package.metadata.docs.rs]
features = ["icu", "persist-fs", "persist-json", "persist-toml", "bundled-icons", "extras", "unstable-catalog", "unstable-spec"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
default = ["icu", "persist-fs", "persist-toml", "bundled-icons", "extras"]
# Fluent UI System Icons resizable font (1.6 MB); without it use `Fluent::from_icon_fonts`.
bundled-icons = []
# `egui_mineral/icu`: ICU4X locale formatting.
icu = ["egui_mineral/icu"]
# `egui_mineral/persist-json`: JSON codec.
persist-json = ["egui_mineral/persist-json"]
# `egui_mineral/persist-toml`: TOML codec.
persist-toml = ["egui_mineral/persist-toml"]
# `egui_mineral/persist-fs`: file-backed persistence.
persist-fs = ["egui_mineral/persist-fs"]
# `egui_mineral/platform-pickers`: file dialogs.
platform-pickers = ["egui_mineral/platform-pickers"]
# `egui_mineral/platform-clipboard`: OS clipboard.
platform-clipboard = ["egui_mineral/platform-clipboard"]
# `egui_mineral/platform-notify`: OS notifications.
platform-notify = ["egui_mineral/platform-notify"]
# `egui_mineral/platform-native`: pickers, clipboard and notifications.
platform-native = ["egui_mineral/platform-native"]
# `egui_mineral/web-save-stream`: streamed browser saves.
web-save-stream = ["egui_mineral/web-save-stream"]
# `egui_mineral/spawn-tokio`: `TokioSpawner`, native only.
spawn-tokio = ["egui_mineral/spawn-tokio"]
# `egui_mineral/spawn-wasm`: `WasmSpawner`, wasm32 only.
spawn-wasm = ["egui_mineral/spawn-wasm"]
# Components beyond Fluent UI React v9 (`extras` module).
extras = []
# Component provenance: `catalog` module. Unstable: outside semver.
unstable-catalog = []
# Spec tokens and component defaults as public API. Unstable: outside semver.
unstable-spec = []

[dependencies]
egui_mineral.workspace = true
egui.workspace = true
parking_lot.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
egui_mineral_material = { workspace = true, default-features = false }
futures-executor.workspace = true

[[test]]
name = "spec"
required-features = ["extras", "unstable-spec", "icu", "bundled-icons"]

[[test]]
name = "behavior"
required-features = ["extras", "icu", "bundled-icons"]

[lints]
workspace = true
