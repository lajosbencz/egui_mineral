[package]
name = "egui_mineral_eframe"
description = "eframe adapter for egui_mineral: the adapter owns the runtime, the app implements its UI"
version = "0.12.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["egui", "eframe", "gui", "ui"]
categories.workspace = true

[package.metadata.docs.rs]
features = ["glow", "wayland", "x11"]
rustdoc-args = ["--cfg", "docsrs"]
targets = ["x86_64-unknown-linux-gnu", "wasm32-unknown-unknown"]

[features]
default = ["glow", "wayland", "x11"]
# eframe renderers; eframe needs at least one.
glow = ["eframe/glow"]
wgpu = ["eframe/wgpu"]
# eframe Linux windowing; winit needs at least one there.
wayland = ["eframe/wayland"]
x11 = ["eframe/x11"]

[dependencies]
egui_mineral.workspace = true
eframe.workspace = true

[lints]
workspace = true
