[package]
name = "showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
egui_mineral = { workspace = true, features = ["platform-native", "web-save-stream"] }
egui_mineral_material = { workspace = true, features = ["icu", "persist-fs", "unstable-catalog", "unstable-spec"] }
mineral_inspector.workspace = true
eframe.workspace = true
egui.workspace = true
tracing.workspace = true
futures-util.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_mineral_material = { workspace = true, features = ["theme-file"] }
tracing-subscriber.workspace = true
futures-executor.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-subscriber.workspace = true
tracing-web.workspace = true
wasm-bindgen-futures.workspace = true
gloo-timers = { workspace = true, features = ["futures"] }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[build-dependencies]
allsorts.workspace = true
serde_json.workspace = true

[lints]
workspace = true
