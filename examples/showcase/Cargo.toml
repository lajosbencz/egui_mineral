[package]
name = "showcase"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
egui_mineral = { workspace = true, features = ["platform-native", "web-save-stream"] }
egui_mineral_material = { workspace = true, features = ["icu", "persist-fs", "unstable-catalog", "unstable-spec"] }
mineral_inspector.workspace = true
# glow: a smaller web bundle than eframe's default wgpu.
eframe = { workspace = true, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "system_fonts", "wayland", "web_screen_reader", "x11"] }
egui.workspace = true
tracing.workspace = true
futures-util.workspace = true
serde.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
egui_mineral_material = { workspace = true, features = ["theme-file"] }
tracing-subscriber.workspace = true
futures-executor.workspace = true
# Restores eframe's default `winit/default`: Wayland client-side decorations and dlopen.
winit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
tracing-subscriber.workspace = true
tracing-web.workspace = true
wasm-bindgen-futures.workspace = true
gloo-timers = { workspace = true, features = ["futures"] }
web-sys = { workspace = true, features = ["Window", "Document", "Element", "HtmlCanvasElement"] }

[build-dependencies]
allsorts.workspace = true
serde_json.workspace = true

[lints]
workspace = true

[package.metadata.cargo-machete]
ignored = ["winit"]
