# Prefixes: chore(deps) ships in the crates and counts towards a release, ci(deps) does not.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    # Triggered once a week old, unless a security update
    cooldown:
      default-days: 7
    groups:
      cargo-minor:
        update-types: [minor, patch]
      cargo-major:
        update-types: [major]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Majors tied to dependents: fluent-langneg to fluent-bundle's unic-langid, parking_lot to egui and wgpu.
      - dependency-name: fluent-langneg
        update-types: [version-update:semver-major]
      - dependency-name: parking_lot
        update-types: [version-update:semver-major]
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
    commit-message:
      prefix: "ci(deps)"
