name: Showcases

# The Pages wasm builds (`just showcases`), verified on pull requests that touch them.
# A push to master seeds the cache that pull requests restore.
on:
  pull_request:
    paths:
      - crates/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - justfile
      - .github/workflows/showcases.yml
  push:
    branches: [master]
    paths:
      - crates/**
      - examples/**
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - justfile
      - .github/workflows/showcases.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: showcases-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  trunk:
    name: Trunk build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          profile: minimal
          cache-key: showcases
          tools: trunk=trunk_version
      - run: just icu-datagen
      - run: just showcases
