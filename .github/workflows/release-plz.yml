name: Release

# https://release-plz.dev/docs/github/quickstart
on:
  push:
    branches: [master]

permissions: {}

jobs:
  gate:
    name: Release merge
    if: ${{ github.repository_owner == 'lajosbencz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      # The pushed commit is the merge of a PR labelled `release` (release-plz `pr_labels`).
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq \
            'any(.[]; .merged_at != null and .merge_commit_sha == env.SHA and any(.labels[]; .name == "release"))')
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: Publish
    needs: gate
    # Only a merged release PR enters the crates-io environment.
    if: ${{ needs.gate.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  # The showcases build from the workspace sources, so they need not wait for crates.io.
  pages:
    name: Pages
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' }}
    permissions:
      contents: read
    # actionlint does not parse `$/` yet.
    uses: ./.github/workflows/pages-build.yml # zizmor: ignore[self-repository]

  # Only a successful publish deploys the showcases of the merged release.
  pages-deploy:
    name: Pages deploy
    needs: [pages, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # After publishing: a release PR opened while crates.io lacks the new tags proposes the versions being published.
  pr:
    name: Release PR
    needs: [gate, release]
    if: ${{ !cancelled() && github.repository_owner == 'lajosbencz' && needs.gate.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds RELEASE_APP_PRIVATE_KEY (master only); `release` reads its copy in crates-io.
    environment: release
    permissions: {}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      pr: ${{ steps.release-plz.outputs.pr }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  # release-plz versions crates one by one; the published crates share 0.MINOR (MAJOR from 1.0).
  # Raises the others on the release PR branch when one crate's breaking version rose.
  align:
    name: Align breaking versions
    needs: pr
    # The implicit success() fails on the skipped `release` upstream of `pr`; release-plz outputs `{}` without a PR.
    if: ${{ !cancelled() && needs.pr.result == 'success' && contains(needs.pr.outputs.pr, 'head_branch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions: {}
    steps:
      - id: branch
        env:
          PR: ${{ needs.pr.outputs.pr }}
        run: |
          echo "head=$(jq -rn --argjson pr "${PR:-null}" '$pr.head_branch // empty')" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -rn --argjson pr "${PR:-null}" '$pr.html_url // empty')" >> "$GITHUB_OUTPUT"
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.head }}
          persist-credentials: false
      - run: rustup toolchain install
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
          fallback: none
      - id: pins
        run: echo "cargo-edit=$(just --evaluate cargo_edit_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-edit@${{ steps.pins.outputs.cargo-edit }}
          fallback: cargo-install
      - env:
          BRANCH: ${{ steps.branch.outputs.head }}
          URL: ${{ steps.branch.outputs.url }}
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          versions() { cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.publish == null) | "\(.name) \(.version)"' | sort; }
          before=$(versions)
          just align-breaking
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: align published crates on one breaking version"
          git push "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${BRANCH}"
          # The PR body lists the versions release-plz planned: `* `crate`: [old -> ]new` and the changelog headings.
          body=$(GH_TOKEN=$TOKEN gh pr view "$URL" --json body --jq .body)
          while read -r c old new; do
            [ "$old" = "$new" ] && continue
            o=${old//./\\.}
            body=$(sed -E -e "s/^(\* \`$c\`: (.* -> )?)$o([^0-9.]|$)/\1$new\3/" -e "s/^## \[$o\]\((.*)$c-v$o\)/## [$new](\1$c-v$new)/" <<<"$body")
          done < <(join <(echo "$before") <(versions))
          GH_TOKEN=$TOKEN gh pr edit "$URL" --body "$body"
