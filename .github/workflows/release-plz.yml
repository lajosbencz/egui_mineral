name: Release

# https://release-plz.dev/docs/github/quickstart
on:
  push:
    branches: [master]

permissions: {}

jobs:
  # `owner`: this repository, not a fork. `release`: also the pushed commit is the merge of a PR labelled `release` (release-plz `pr_labels`).
  gate:
    name: Release merge
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      owner: ${{ steps.check.outputs.owner }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          OWNER: ${{ github.repository_owner == 'lajosbencz' }}
        run: |
          release=false
          if [ "$OWNER" = true ]; then
            release=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq \
              'any(.[]; .merged_at != null and .merge_commit_sha == env.SHA and any(.labels[]; .name == "release"))')
          fi
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: Publish
    needs: gate
    # Only a merged release PR enters the crates-io environment.
    if: ${{ needs.gate.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  # The showcases build from the workspace sources, so they need not wait for crates.io.
  pages:
    name: Pages
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' }}
    permissions:
      contents: read
    # actionlint does not parse `$/` yet.
    uses: ./.github/workflows/pages-build.yml # zizmor: ignore[self-repository]

  # Only a successful publish deploys the showcases of the merged release.
  pages-deploy:
    name: Pages deploy
    needs: [pages, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # After publishing: a release PR opened while crates.io lacks the new tags proposes the versions being published.
  pr:
    name: Release PR
    needs: [gate, release]
    # A skipped `release` fails the implicit success(), so the condition is explicit.
    if: ${{ !cancelled() && needs.gate.outputs.owner == 'true' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds RELEASE_APP_PRIVATE_KEY (master only); `release` reads its copy in crates-io.
    environment: release
    permissions: {}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      pr: ${{ steps.release-plz.outputs.pr }}
    steps:
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  # release-plz versions crates one by one; the published crates share 0.MINOR (MAJOR from 1.0).
  # Raises the others on the release PR branch when one crate's breaking version rose.
  align:
    name: Align breaking versions
    needs: pr
    # `!cancelled()`: see `pr`. release-plz outputs `{}` without a PR.
    if: ${{ !cancelled() && contains(needs.pr.outputs.pr, 'head_branch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions: {}
    steps:
      - id: branch
        env:
          PR: ${{ needs.pr.outputs.pr }}
        run: |
          echo "head=$(jq -rn --argjson pr "${PR:-null}" '$pr.head_branch // empty')" >> "$GITHUB_OUTPUT"
          echo "url=$(jq -rn --argjson pr "${PR:-null}" '$pr.html_url // empty')" >> "$GITHUB_OUTPUT"
      - id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.branch.outputs.head }}
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          tools: cargo-edit=cargo_edit_version
          fallback: cargo-install
      - env:
          BRANCH: ${{ steps.branch.outputs.head }}
          URL: ${{ steps.branch.outputs.url }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: just align-pr "$BRANCH" "$URL"
