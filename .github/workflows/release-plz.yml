name: Release

# https://release-plz.dev/docs/github/quickstart
on:
  push:
    branches: [master]

permissions: {}

jobs:
  release:
    name: Publish
    if: ${{ github.repository_owner == 'lajosbencz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  pr:
    name: Release PR
    if: ${{ github.repository_owner == 'lajosbencz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      pr: ${{ steps.release-plz.outputs.pr }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  align:
    name: Align breaking versions
    needs: pr
    if: ${{ needs.pr.outputs.pr != '' }}
    permissions: {}
    # actionlint does not parse `$/` yet.
    uses: ./.github/workflows/release-align.yml # zizmor: ignore[self-repository]
    with:
      pr: ${{ needs.pr.outputs.pr }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
