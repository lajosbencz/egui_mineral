name: Release

# https://release-plz.dev/docs/github/quickstart
on:
  push:
    branches: [master]

permissions: {}

jobs:
  gate:
    name: Release merge
    if: ${{ github.repository_owner == 'lajosbencz' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      # The pushed commit is the merge of a PR labelled `release` (release-plz `pr_labels`).
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          release=$(gh api "repos/$GITHUB_REPOSITORY/commits/$SHA/pulls" --jq \
            'any(.[]; .merged_at != null and .merge_commit_sha == env.SHA and any(.labels[]; .name == "release"))')
          echo "release=$release" >> "$GITHUB_OUTPUT"

  release:
    name: Publish
    needs: gate
    # Only a merged release PR enters the crates-io environment.
    if: ${{ needs.gate.outputs.release == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  # The showcases build from the workspace sources, so they need not wait for crates.io.
  pages:
    name: Pages
    needs: gate
    if: ${{ needs.gate.outputs.release == 'true' }}
    # The ceiling for every job of pages.yml, its skipped workflow_dispatch deploy included; each job narrows it.
    permissions:
      contents: read
      pages: write
      id-token: write
    # actionlint does not parse `$/` yet.
    uses: ./.github/workflows/pages.yml # zizmor: ignore[self-repository]

  # Only a successful publish deploys the showcases of the merged release.
  pages-deploy:
    name: Pages deploy
    needs: [pages, release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # After publishing: a release PR opened while crates.io lacks the new tags proposes the versions being published.
  pr:
    name: Release PR
    needs: [gate, release]
    if: ${{ !cancelled() && github.repository_owner == 'lajosbencz' && needs.gate.result == 'success' && needs.release.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      pr: ${{ steps.release-plz.outputs.pr }}
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install
      - id: release-plz
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}

  align:
    name: Align breaking versions
    needs: pr
    # The implicit success() fails on the skipped `release` upstream of `pr`.
    if: ${{ !cancelled() && needs.pr.result == 'success' && needs.pr.outputs.pr != '' }}
    permissions: {}
    # actionlint does not parse `$/` yet.
    uses: ./.github/workflows/release-align.yml # zizmor: ignore[self-repository]
    with:
      pr: ${{ needs.pr.outputs.pr }}
    secrets:
      app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
