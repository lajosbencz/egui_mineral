name: Pages build

# The showcase site as the `github-pages` artifact; callers deploy it (pages.yml by hand, the release workflow after publishing).
on:
  workflow_call:

permissions: {}

env:
  CARGO_TERM_COLOR: always
  PUBLIC_URL: /egui_mineral/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Restores the cache `showcases.yml` saves on master.
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          profile: minimal
          cache-key: showcases
          cache-save: "false"
          tools: trunk=trunk_version
      - run: just icu-datagen
      - run: just showcases "$PUBLIC_URL"
      - name: Assemble site
        run: |
          mkdir site
          cp -r .github/pages/. site/
          cp -r examples/showcase-fluent/dist site/fluent
          cp -r examples/showcase-material/dist site/material
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
