# Dependabot patch and minor updates merge once the required checks pass.
# Major ones wait for a human approval.
name: Dependabot auto-merge

# A merge by GITHUB_TOKEN triggers no push workflows; release-plz and Pages catch up on the next push.
on: pull_request

permissions: {}

jobs:
  automerge:
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'lajosbencz/egui_mineral' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      # fetch-metadata calls 0.9 -> 0.10 minor; Cargo and the cargo-major group call it breaking.
      - if: >-
          (steps.meta.outputs.update-type == 'version-update:semver-minor' ||
          steps.meta.outputs.update-type == 'version-update:semver-patch') &&
          steps.meta.outputs.dependency-group != 'cargo-major'
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ github.token }}
