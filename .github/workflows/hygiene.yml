name: Hygiene

# Lints that need no build
on:
  pull_request:
  # The one sanctioned scheduled job: advisories and typos drift without a push.
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # `just typos` locally.
  typos:
    name: Spelling
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: crate-ci/typos@276087d9a4f06398b3e04825487805e2d7375888 # v1.52.2

  # `just deny` locally.
  deny:
    name: Dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1

  rules:
    name: Structural rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          rust: "false"
      # Not in install-action: checked against its published digest.
      - name: ast-grep
        run: |
          curl -sSfL "https://github.com/ast-grep/ast-grep/releases/download/$(just --evaluate ast_grep_version)/app-x86_64-unknown-linux-gnu.zip" \
            -o "$RUNNER_TEMP/ast-grep.zip"
          echo "$(just --evaluate ast_grep_sha256)  $RUNNER_TEMP/ast-grep.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ast-grep.zip" -d "$RUNNER_TEMP/ast-grep"
          PATH="$RUNNER_TEMP/ast-grep:$PATH" just rules

  machete:
    name: Unused dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          rust: "false"
          tools: cargo-machete=machete_version
      - run: just machete

  workflows:
    name: Workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          rust: "false"
          tools: shellcheck,zizmor=zizmor_version
      - name: actionlint and zizmor
        run: |
          version=$(just --evaluate actionlint_version)
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v$version/actionlint_${version}_linux_amd64.tar.gz" \
            -o "$RUNNER_TEMP/actionlint.tar.gz"
          echo "$(just --evaluate actionlint_sha256)  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          PATH="$RUNNER_TEMP:$PATH" just workflows
        env:
          GH_TOKEN: ${{ github.token }}

  result:
    name: Hygiene result
    if: ${{ always() }}
    needs: [typos, deny, rules, machete, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
