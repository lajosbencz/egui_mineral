name: Pages

# The showcases track the released crates; release-plz publishes one release per crate with the App token, so each triggers this.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  # A multi-crate release publishes several releases in a row: the last one builds.
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  PUBLIC_URL: /egui_mineral/

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain
        run: rustup toolchain install --profile minimal
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
          fallback: none
      - id: pins
        run: echo "trunk=$(just --evaluate trunk_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: trunk@${{ steps.pins.outputs.trunk }}
          fallback: none
      - run: just icu-datagen
      - run: just showcases "$PUBLIC_URL"
      - name: Assemble site
        run: |
          mkdir site
          cp -r .github/pages/. site/
          cp -r examples/showcase-fluent/dist site/fluent
          cp -r examples/showcase-material/dist site/material
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
