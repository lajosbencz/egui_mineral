name: Pages

# Builds and deploys the showcases by hand; releases deploy them from the release workflow.
on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build
    permissions:
      contents: read
    # actionlint does not parse `$/` yet.
    uses: ./.github/workflows/pages-build.yml # zizmor: ignore[self-repository]

  # Mirrors the release workflow's Pages deploy.
  deploy:
    name: Deploy
    needs: build
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
