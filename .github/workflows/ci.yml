name: CI

# Pull requests verify; the ruleset keeps them up to date with master, so merges are not verified again.
# A push to master that changes what the caches are keyed on only builds, saving the caches pull requests restore.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.event_name == 'push' }}
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-nextest,just@1.59.0
          fallback: none
      # The docs.rs build in `just doc`.
      - if: ${{ github.event_name != 'push' }}
        run: rustup toolchain install nightly --profile minimal
      - id: pins
        if: ${{ github.event_name != 'push' }}
        run: echo "rdme=$(just --evaluate rdme_version)" >> "$GITHUB_OUTPUT"
      - if: ${{ github.event_name != 'push' }}
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-rdme@${{ steps.pins.outputs.rdme }}
          fallback: cargo-install
      # Installed on push too, for the cache.
      - run: just icu-datagen
      - if: ${{ github.event_name == 'push' }}
        run: just clippy test --no-run
      - if: ${{ github.event_name != 'push' }}
        run: just check

  # Fails when specs change, never blocks merging
  spec:
    name: Generated spec
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
          fallback: none
      - run: just spec

  # Fails on any public API change vs the PR base (release PRs: the last release tag), never blocks merging
  public-api:
    name: Public API diff
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      # cargo-public-api builds rustdoc JSON with nightly.
      - run: rustup toolchain install nightly --profile minimal --target wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: false
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: just@1.59.0
          fallback: none
      - id: pins
        run: echo "public-api=$(just --evaluate public_api_version)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-public-api@${{ steps.pins.outputs.public-api }}
          fallback: cargo-install
      - name: Diff against base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          base=$BASE_SHA
          if [[ $HEAD_REF == release-plz-* ]]; then
            base=$(git describe --tags --abbrev=0 --match 'v*' "$BASE_SHA" || echo "$BASE_SHA")
          fi
          just api-diff "$base" "$HEAD_SHA"

  result:
    name: CI result
    if: ${{ always() }}
    needs: [check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Default-branch caches: the newest per key. rust-cache keys end in the lockfile's hash.
  caches:
    name: Prune caches
    needs: [check]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 100 --sort created_at --order desc \
            --json id,key --jq '.[] | select(.key | startswith("v0-rust-")) | "\(.id)\t\(.key | sub("-[0-9a-f]+$"; ""))"' |
          awk -F '\t' 'seen[$2]++ { print $1 }' |
          while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
