name: CI

# Pull requests verify; the ruleset keeps them up to date with master, so merges are not verified again.
# Pull requests that change only prose skip the builds; skipped jobs pass the required `CI result`.
# A push to master that changes what the caches are keyed on only builds (clippy, test, docs, spec generators, rustdoc JSON), saving the caches pull requests restore.
on:
  pull_request:
  push:
    branches: [master]
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
      - rust-toolchain.toml
      - justfile
      - .github/workflows/ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only

jobs:
  # `just changes`: pushes and manual runs build everything.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code || 'true' }}
      deps: ${{ steps.diff.outputs.deps || 'true' }}
    steps:
      - if: ${{ github.event_name == 'pull_request' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The merge commit and its base parent.
          fetch-depth: 2
      - if: ${{ github.event_name == 'pull_request' }}
        uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          rust: "false"
      - id: diff
        if: ${{ github.event_name == 'pull_request' }}
        run: just changes HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"

  # `just check-clippy` locally: the feature matrix, native, wasm32 and Windows.
  clippy:
    name: Clippy
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          cache-key: clippy
          linux-deps: "true"
          tools: cargo-hack=hack_version
          fallback: cargo-install
      - run: just check-clippy

  # `just check-test` locally: nextest legs and the ICU4X trimmed-data test.
  test:
    name: Test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NEXTEST_PROFILE: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          cache-key: test
          tools: cargo-nextest
      - run: just icu-datagen
      - run: just check-test

  # `just check-docs` locally: rustdoc and the docs.rs build, READMEs, versions, fmt, unstable guard;
  # `check-deps` (minimal versions) when a manifest, the lockfile or the toolchain changed, `check-release` (package) on release PRs.
  docs:
    name: Docs and packaging
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          cache-key: docs
          linux-deps: "true"
          nightly: wasm32-unknown-unknown
          tools: cargo-rdme=rdme_version
          fallback: cargo-install
      - run: just check-docs
      - if: ${{ needs.changes.outputs.deps == 'true' }}
        run: just check-deps
      - if: ${{ startsWith(github.head_ref, 'release-plz-') }}
        run: just check-release

  # Fails when specs change, never blocks merging; a push only builds the generators.
  spec:
    name: Generated spec
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          cache-key: spec
          linux-deps: "true"
      - env:
          GH_TOKEN: ${{ github.token }}
          RECIPE: ${{ github.event_name == 'push' && 'spec-build' || 'spec' }}
        run: just "$RECIPE"

  # The docs.rs targets of the published crates (`just api-targets`).
  api-targets:
    name: Public API targets
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          rust: "false"
      - id: targets
        run: echo "targets=$(just api-targets | cut -d' ' -f2 | sort -u | jq -Rnc '[inputs]')" >> "$GITHUB_OUTPUT"

  # `just api-diff`, one job per docs.rs target over every published crate: removed or changed public API vs the PR base
  # (release PRs: each crate's last release tag) fails unless the breaking version rises. A push only builds HEAD.
  public-api:
    name: Public API diff (${{ matrix.target }})
    needs: api-targets
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.api-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup # zizmor: ignore[self-repository] actionlint does not parse `$/` yet
        with:
          cache-key: public-api-${{ matrix.target }}
          nightly: ${{ matrix.target }}
          tools: cargo-public-api=public_api_version
          fallback: cargo-install
      - env:
          BASE: ${{ github.event.pull_request.base.sha || 'HEAD' }}
          HEAD: ${{ github.event.pull_request.head.sha || 'HEAD' }}
          RELEASE: ${{ startsWith(github.head_ref, 'release-plz-') }}
          TARGET: ${{ matrix.target }}
        run: just api-diff "$BASE" "$HEAD" "$RELEASE" "$TARGET"

  result:
    name: CI result
    if: ${{ always() }}
    needs: [changes, clippy, test, docs, spec, api-targets, public-api]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1

  # Default-branch caches: the newest per key. rust-cache keys end in the lockfile's hash.
  caches:
    name: Prune caches
    needs: [clippy, test, docs, spec, api-targets, public-api]
    if: ${{ always() && github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 100 --sort created_at --order desc \
            --json id,key --jq '.[] | select(.key | startswith("v0-rust-")) | "\(.id)\t\(.key | sub("-[0-9a-f]+$"; ""))"' |
          awk -F '\t' 'seen[$2]++ { print $1 }' |
          while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
